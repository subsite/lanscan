# Builds the RPM and deb packages. A pushed tag (v1.2.3, see
# tools/release.sh) publishes them as a GitHub release; a manual run
# only keeps them as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install tools
        run: |
          dnf install -y git make tar rpm-build python3-rpm-macros \
            desktop-file-utils python3-gobject python3-cairo gtk4 \
            libadwaita
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test
      - name: Build RPM
        run: tools/build-packages.sh rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: tools/build-packages.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [rpm, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.rpm dist/*.deb \
            --title "LAN Scan ${GITHUB_REF_NAME#v}" --generate-notes
