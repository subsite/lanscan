[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lanscan"
version = "0.1.2"
description = "Graphical overview of the devices on your local network"
license = "GPL-3.0-or-later"
authors = [{name = "SubSite - Fredrik Welander"}]
urls = {Homepage = "https://github.com/subsite/lanscan"}
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.46"]

[project.gui-scripts]
lanscan = "lanscan.app:main"

[tool.setuptools]
packages = ["lanscan"]

[tool.setuptools.package-data]
lanscan = ["icons/*.svg"]
